<!doctype html>
<html lang="en"> 
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>AI Web Dev Chatbot</title> 
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
    }

    .header {
      background: #161b22;
      padding: 12px 16px;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: #00ffd0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      color: #f0f6fc;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #0d1117;
    }

    .message {
      margin-bottom: 16px;
      line-height: 1.4;
      font-size: 14px;
      max-width: 85%;
    }

    .user {
      margin-left: auto;
      background: #1f6feb;
      color: white;
      padding: 8px 12px;
      border-radius: 12px 12px 4px 12px;
    }

    .bot {
      background: #21262d;
      padding: 8px 12px;
      border-radius: 12px 12px 12px 4px;
      color: #e6edf3;
    }

    pre {
      background: #161b22;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #7ee787;
      margin: 8px 0;
      font-size: 13px;
      border: 1px solid #30363d;
    }

    code {
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .input-area {
      background: #161b22;
      padding: 12px 16px;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 14px;
      resize: none;
      height: 42px;
      max-height: 120px;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: #1f6feb;
    }

    button {
      background: #1f6feb;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    button:hover {
      background: #2a7bf5;
    }

    .voice-btn {
      background: #21262d;
      color: #7d8590;
    }

    .voice-btn:hover {
      background: #30363d;
    }

    .typing-indicator {
      display: inline-block;
      padding: 8px 12px;
      background: #21262d;
      border-radius: 12px 12px 12px 4px;
      color: #7d8590;
    }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
    }

    .typing-dots span {
      height: 6px;
      width: 6px;
      border-radius: 50%;
      background: #7d8590;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    /* Scrollbar styling */
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: #0d1117;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }

    .chat-box::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }
  </style> 
 </head> 
 <body> 
  <div class="chat-container"> 
   <div class="header">
     <div class="logo">A</div>
     <h1>Akash AI Assistant</h1>
   </div>
   <div id="chatBox" class="chat-box"></div> 
   <div class="input-area"> 
     <textarea id="userInput" placeholder="Message Akash AI..." rows="1"></textarea> 
     <button class="voice-btn" onclick="startVoice()">🎙️</button>
     <button onclick="sendMessage()">➤</button> 
   </div> 
  </div>
  
  <script>
    const API_KEY = "AIzaSyDSIy5m7mTXlMMR_OOdCu2Af_EwoCd124w"; // Replace with your Gemini API Key
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    // Auto-resize textarea
    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      if (this.scrollHeight > 120) {
        this.style.overflowY = 'auto';
      } else {
        this.style.overflowY = 'hidden';
      }
    });

    // Send message on Enter (but allow Shift+Enter for new line)
    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const userText = userInput.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      userInput.value = "";
      userInput.style.height = '42px';
      getBotResponse(userText);
    }

    function addMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;

      if (sender === "bot" && text.includes("```")) {
        const parsed = parseCode(text);
        msg.innerHTML = parsed;
      } else {
        msg.innerText = text;
      }

      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function parseCode(text) {
      return text.replace(/```(\w+)?([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function getBotResponse(prompt) {
      const thinking = document.createElement("div");
      thinking.className = "message bot typing-indicator";
      thinking.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      chatBox.appendChild(thinking);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "❌ No response.";
        thinking.remove();
        addMessage("bot", aiText);
      } catch (err) {
        thinking.remove();
        addMessage("bot", "⚠️ Error getting response.");
      }
    }

    // Voice input
    function startVoice() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "en-US";
      recognition.start();
      
      const voiceBtn = document.querySelector('.voice-btn');
      voiceBtn.style.background = '#da3633';
      
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        voiceBtn.style.background = '#21262d';
      };
      
      recognition.onerror = (event) => {
        alert("Voice input error: " + event.error);
        voiceBtn.style.background = '#21262d';
      };
      
      recognition.onend = () => {
        voiceBtn.style.background = '#21262d';
      };
    }
  </script> 
 </body>
</html>
